[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site_demo"
version = "0.2.0"
description = "Uni-Lab-OS 位点与物料演示设备包：host/slave 双进程、available_sites 固定位点、deck/枪头盒/孔板物料 CRUD 与 set_substance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["site_demo*"]

[tool.setuptools.data-files]
"share/site_demo/graph" = ["graph/*.json"]
