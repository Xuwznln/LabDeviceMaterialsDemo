[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site_demo"
version = "0.1.0"
description = "Uni-Lab-OS 位点展示演示设备包：available_sites 固定位点实例化、样品装载与位点间转移"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["site_demo*"]

[tool.setuptools.data-files]
"share/site_demo/graph" = ["graph/*.json"]
